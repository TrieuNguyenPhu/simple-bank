services:
  postgres17:
    image: postgres:17-alpine
    container_name: postgres17
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: simple_bank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d simple_bank"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simplebank-api
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      ENVIRONMENT: development
      DB_SOURCE: postgresql://root:secret@postgres17:5432/simple_bank?sslmode=disable
      MIGRATION_URL: file://db/migration
      REDIS_ADDRESS: redis:6379
      HTTP_SERVER_ADDRESS: 0.0.0.0:8080
      GRPC_SERVER_ADDRESS: 0.0.0.0:9090
      TOKEN_SYMMETRIC_KEY: "12345678901234567890123456789012"
      ACCESS_TOKEN_DURATION: 15m
      REFRESH_TOKEN_DURATION: 24h
      ALLOWED_ORIGINS: http://localhost:3000
      EMAIL_SENDER_NAME: Simple Bank
      EMAIL_SENDER_ADDRESS: your-email@gmail.com
      EMAIL_SENDER_PASSWORD: your-app-password
    depends_on:
      postgres17:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      [
        "/app/wait-for.sh",
        "postgres17:5432",
        "--",
        "/app/start.sh",
      ]
    command: ["/app/main"]
    restart: unless-stopped

volumes:
  postgres_data:
